<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificates | Admin Console</title><link rel="stylesheet" href="css/admin-core.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"><script src="https://unpkg.com/lucide@latest"></script><style>.cert-page{padding:32px}.cert-card{background:#fff;border:1px solid var(--admin-border);border-radius:18px;padding:22px;box-shadow:var(--shadow-sm)}.cert-table{width:100%;border-collapse:collapse}.cert-table th,.cert-table td{text-align:left;padding:13px;border-bottom:1px solid var(--admin-border);font-size:13px}.cert-table th{color:var(--admin-muted);font-size:11px;text-transform:uppercase}.status{display:inline-flex;padding:5px 9px;border-radius:8px;background:#eaf8f1;color:#168653;font-size:10px;font-weight:700}@media(max-width:700px){.cert-page{padding:18px 12px}.cert-card{overflow:auto}.cert-table{min-width:680px}}</style></head><body><div class="admin-app"><aside id="adminSidebar" class="admin-sidebar"></aside><div id="sidebarOverlay" class="sidebar-overlay"></div><main class="admin-main"><header id="adminTopbar" class="admin-topbar"></header><section class="admin-page cert-page"><div class="page-header"><div><span class="page-eyebrow">ACADEMY RECORDS</span><h1>Certificates</h1><p>Read-only view of certificates issued to learners.</p></div></div><div class="cert-card"><table class="cert-table"><thead><tr><th>Recipient</th><th>Course</th><th>Certificate</th><th>Status</th><th>Issued</th></tr></thead><tbody id="certificateRows"><tr><td colspan="5">Loading certificates…</td></tr></tbody></table></div></section></main></div><script type="module" src="js/admin-app.js"></script><script type="module">import {db} from "../js/firebase.js";import {collection,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const rows=document.getElementById("certificateRows");const esc=v=>String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));const date=v=>v?.toDate?.()?v.toDate().toLocaleDateString("en-KE"):v?new Date(v).toLocaleDateString("en-KE"):"—";document.addEventListener("admin:ready",async()=>{try{const snap=await getDocs(collection(db,"certificates"));const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.issuedAt?.toMillis?.()||b.createdAt?.toMillis?.()||0)-(a.issuedAt?.toMillis?.()||a.createdAt?.toMillis?.()||0));rows.innerHTML=docs.length?docs.map(c=>`<tr><td>${esc(c.studentName||c.recipientName||c.email||"Unknown")}</td><td>${esc(c.courseName||c.courseTitle||"Course completion")}</td><td>${esc(c.certificateNumber||c.number||c.id)}</td><td><span class="status">${esc(c.status||c.verificationStatus||"issued")}</span></td><td>${date(c.issuedAt||c.createdAt)}</td></tr>`).join(""):"<tr><td colspan=\"5\">No certificates have been issued yet.</td></tr>"}catch(e){console.error(e);rows.innerHTML="<tr><td colspan=\"5\">Certificate data is temporarily unavailable.</td></tr>"}});</script></body></html>
