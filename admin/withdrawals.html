<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdrawals | Admin Console</title><link rel="stylesheet" href="css/admin-core.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"><script src="https://unpkg.com/lucide@latest"></script><style>.wd-page{padding:32px}.wd-card{background:#fff;border:1px solid var(--admin-border);border-radius:18px;padding:22px;box-shadow:var(--shadow-sm)}.wd-table{width:100%;border-collapse:collapse}.wd-table th,.wd-table td{text-align:left;padding:13px;border-bottom:1px solid var(--admin-border);font-size:13px}.wd-table th{color:var(--admin-muted);font-size:11px;text-transform:uppercase}.wd-btn{padding:7px 10px;border-radius:8px;font-size:10px;font-weight:700;margin-right:5px}.approve{background:#eaf8f1;color:#168653}.reject{background:#fff0f0;color:#dc4d4d}.pill{display:inline-flex;padding:5px 9px;border-radius:8px;background:#fff6dc;color:#a16d00;font-size:10px;font-weight:700}@media(max-width:700px){.wd-page{padding:18px 12px}.wd-card{overflow:auto}.wd-table{min-width:760px}}</style></head><body><div class="admin-app"><aside id="adminSidebar" class="admin-sidebar"></aside><div id="sidebarOverlay" class="sidebar-overlay"></div><main class="admin-main"><header id="adminTopbar" class="admin-topbar"></header><section class="admin-page wd-page"><div class="page-header"><div><span class="page-eyebrow">FINANCE</span><h1>Withdrawal Reviews</h1><p>Review and process instructor withdrawal requests.</p></div></div><div class="wd-card"><table class="wd-table"><thead><tr><th>Instructor</th><th>Method</th><th>Amount</th><th>Status</th><th>Requested</th><th>Action</th></tr></thead><tbody id="withdrawalRows"><tr><td colspan="6">Loading withdrawals…</td></tr></tbody></table></div></section></main></div><script type="module" src="js/admin-app.js"></script><script type="module">import {db} from "../js/firebase.js";import {collection,getDocs,doc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const rows=document.getElementById("withdrawalRows");const money=v=>`KES ${Number(v||0).toLocaleString()}`;const esc=v=>String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));const date=v=>v?.toDate?.()?v.toDate().toLocaleDateString("en-KE"):v?new Date(v).toLocaleDateString("en-KE"):"—";async function load(){try{const snap=await getDocs(collection(db,"withdrawals"));const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.requestedAt?.toMillis?.()||0)-(a.requestedAt?.toMillis?.()||0));rows.innerHTML=docs.length?docs.map(w=>{const pending=["pending","review","processing"].includes(String(w.status||"pending").toLowerCase());return `<tr><td>${esc(w.instructor||w.instructorName||w.email||"Unknown")}</td><td>${esc(w.method||"—")}</td><td>${money(w.amount)}</td><td><span class="pill">${esc(w.status||"pending")}</span></td><td>${date(w.requestedAt||w.createdAt)}</td><td>${pending?`<button class="wd-btn approve" data-id="${esc(w.id)}" data-status="completed">Approve</button><button class="wd-btn reject" data-id="${esc(w.id)}" data-status="failed">Reject</button>`:"—"}</td></tr>`}).join(""):"<tr><td colspan=\"6\">No withdrawal requests found.</td></tr>"}catch(e){console.error(e);rows.innerHTML="<tr><td colspan=\"6\">Withdrawal data is temporarily unavailable.</td></tr>"}}document.addEventListener("admin:ready",load);rows.addEventListener("click",async e=>{const b=e.target.closest("button[data-id]");if(!b)return;if(!confirm(`${b.dataset.status === "completed" ? "Approve" : "Reject"} this withdrawal?`))return;b.disabled=true;try{await updateDoc(doc(db,"withdrawals",b.dataset.id),{status:b.dataset.status,processedAt:serverTimestamp()});await load()}catch(err){console.error(err);alert("Unable to update this withdrawal.");}finally{b.disabled=false}});</script></body></html>
