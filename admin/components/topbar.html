<!-- ============================================================
     SPARK STACK ACADEMY
     ADMIN MODERATOR TOPBAR
============================================================ -->

<div class="admin-topbar-inner">

    <!-- LEFT -->

    <div class="admin-topbar-left">

        <button
            id="adminMenuToggle"
            class="admin-menu-toggle"
            type="button"
            aria-label="Open menu"
        >
            <i data-lucide="menu"></i>
        </button>


        <div class="admin-breadcrumb">

            <span>
                Moderator Console
            </span>

            <i data-lucide="chevron-right"></i>

            <strong id="adminCurrentPage">
                Dashboard
            </strong>

        </div>

    </div>


    <!-- RIGHT -->

    <div class="admin-topbar-actions">


        <!-- SEARCH -->

        <button
            id="adminSearchBtn"
            class="topbar-icon-btn"
            type="button"
            aria-label="Search"
        >

            <i data-lucide="search"></i>

        </button>


        <!-- NOTIFICATIONS -->

        <a
            href="notifications.html"
            class="topbar-icon-btn notification-trigger"
            aria-label="Notifications"
        >

            <i data-lucide="bell"></i>

            <span
                id="adminNotificationBadge"
                class="notification-badge hidden"
            >
                0
            </span>

        </a>


        <!-- DIVIDER -->

        <span class="topbar-divider"></span>


        <!-- PROFILE -->

        <button
            id="adminProfileMenu"
            class="admin-topbar-profile"
            type="button"
        >

            <div
                id="adminTopbarAvatar"
                class="admin-topbar-avatar"
            >
                A
            </div>

            <div class="admin-topbar-user">

                <strong id="adminTopbarName">
                    Administrator
                </strong>

                <span>
                    Moderator
                </span>

            </div>

            <i
                data-lucide="chevron-down"
                class="profile-chevron"
            ></i>

        </button>


        <!-- PROFILE DROPDOWN -->

        <div
            id="adminProfileDropdown"
            class="admin-profile-dropdown"
        >

            <div class="dropdown-user">

                <div
                    id="dropdownAdminAvatar"
                    class="dropdown-avatar"
                >
                    A
                </div>

                <div>

                    <strong id="dropdownAdminName">
                        Administrator
                    </strong>

                    <span>
                        Moderator Account
                    </span>

                </div>

            </div>


            <div class="dropdown-divider"></div>


            <a href="profile.html">

                <i data-lucide="user-round"></i>

                My Profile

            </a>


            <a href="Settings.html">

                <i data-lucide="settings"></i>

                Settings

            </a>


            <div class="dropdown-divider"></div>


            <button
                id="adminDropdownLogout"
                type="button"
                class="dropdown-danger"
            >

                <i data-lucide="log-out"></i>

                Sign Out

            </button>

        </div>

    </div>

</div>
