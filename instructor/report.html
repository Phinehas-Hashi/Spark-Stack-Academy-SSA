<script src="https://unpkg.com/lucide@latest"></script></head><body><div class="instructor-app"><aside id="instructorSidebar" class="instructor-sidebar"></aside><div id="sidebarOverlay" class="sidebar-overlay"></div><main class="instructor-main"><header id="instructorTopbar" class="instructor-topbar"></header><section class="report-page"><div class="report-card"><span>SPARK SUPPORT</span><h1>Report an issue</h1><p>Submit a case to Academy Admin and the Founder. You'll receive a case ID and feedback here.</p><form id="reportForm" class="report-form"><label>Title<input id="reportTitle" required maxlength="120" placeholder="What happened?"></label><label>Category<select id="reportCategory"><option value="technical">Technical issue</option><option value="student">Student issue</option><option value="course">Course</option><option value="payment">Payment</option><option value="account">Account</option><option value="safety">Safety</option><option value="general">General</option></select></label><label>Priority<select id="reportPriority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select></label><label>Description<textarea id="reportDescription" required placeholder="Explain the issue clearly..."></textarea></label><input id="reportedUserId" type="hidden"><input id="courseId" type="hidden"><button type="submit">Submit Report</button></form><div id="reportResult" class="report-result" aria-live="polite"></div></div><div class="report-card"><h2>My Reports</h2><p>Track case status and leadership feedback.</p><div id="myReports"><div class="report-empty">Loading reports...</div></div></div></section></main></div><script type="module" src="js/instructor-app.js"></script><script type="module" src="../js/report-page.js"></script><script>document.addEventListener('DOMContentLoaded',()=>window.lucide?.createIcons());</script></body></html>
