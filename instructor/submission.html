<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11101a">
    <title>Review Submission | Spark Stack Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/instructor-core.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/submission.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="submission-shell">
        <header class="submission-header">
            <a id="backToAssignment" href="assignments.html" class="back-link">
                <i data-lucide="arrow-left" aria-hidden="true"></i>
                <span>Back to assignment</span>
            </a>
            <div class="submission-heading">
                <span class="eyebrow">INSTRUCTOR REVIEW</span>
                <h1>Submission review</h1>
                <p>Assess the student's written work, record a mark and return clear feedback.</p>
            </div>
        </header>
        <main id="submissionState" class="submission-card" aria-live="polite" aria-busy="true">
            <div class="submission-loading" role="status">
                <span class="loading-ring" aria-hidden="true"></span>
                <strong>Loading submission</strong>
                <span>Verifying assignment ownership and retrieving student work.</span>
            </div>
        </main>
    </div>
    <script type="module" src="js/submission.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide?.createIcons) window.lucide.createIcons();
        });
    </script>
</body>
</html>
