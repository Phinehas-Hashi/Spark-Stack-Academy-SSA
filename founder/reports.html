<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Founder critical reports and security incidents">
<title>Critical Reports | Spark Stack Academy Founder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="founder-unified.css">
<link rel="stylesheet" href="founder-imperial.css">
<link rel="stylesheet" href="reports.css">
</head>
<body>
<div class="dashboard-layout">
<aside id="sidebarContainer"></aside>
<div id="sidebarOverlay"></div>
<main class="main-content">
<header id="topbarContainer"></header>
<section class="reports-hero">
<div><span class="eyebrow">FOUNDER INTELLIGENCE</span><h1>Critical &amp; System Reports</h1><p>Review platform incidents, safety reports and security signals. Location data is approximate and attribution is limited to verified account metadata.</p></div>
<div class="report-hero-metric"><span>Loaded reports</span><strong id="reportCount">—</strong></div>
</section>
<div id="reportsDataStatus" class="reports-data-status" role="status" aria-live="polite"><span class="status-dot"></span><span id="reportsDataStatusText">Verifying Founder access…</span></div>
<section class="reports-controls">
<input id="reportSearch" type="search" placeholder="Search report, actor, category or location…" autocomplete="off" aria-label="Search reports">
<select id="reportPriority" aria-label="Filter report priority"><option value="all">All priorities</option><option value="critical">Critical</option><option value="high">High</option><option value="normal">Normal</option></select>
<select id="reportStatus" aria-label="Filter report status"><option value="all">All statuses</option><option value="pending">Pending</option><option value="reviewed">Reviewed</option><option value="resolved">Resolved</option></select>
</section>
<section id="reports" class="reports-list" aria-live="polite"><div class="empty">Loading verified reports…</div></section>
</main>
</div>
<script type="module" src="./js/founder-app.js"></script>
<script type="module" src="reports.js"></script>
</body>
</html>
