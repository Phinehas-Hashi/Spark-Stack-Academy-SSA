<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium Management | Founder OS</title><link rel="stylesheet" href="founder-unified.css"><style>body{background:#f6f8fc;font-family:Inter,Poppins,system-ui;color:#0f172a}.pm-page{max-width:1200px;margin:auto;padding:32px}.pm-card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:0 12px 35px rgba(15,23,42,.06)}.pm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pm-user{border:1px solid #e2e8f0;border-radius:16px;padding:16px}.pm-user strong,.pm-user span{display:block}.pm-user span{font-size:12px;color:#64748b;margin-top:4px}.pm-user button{margin-top:12px;border:0;border-radius:10px;padding:10px 12px;background:#2979ff;color:#fff;font-weight:800}.pm-user button.danger{background:#dc2626}@media(max-width:800px){.pm-page{padding:16px}.pm-grid{grid-template-columns:1fr}}</style></head><body><main class="pm-page"><section class="pm-card"><small>FOUNDER CONTROL</small><h1>Premium Subscription Manager</h1><p>Only the Founder can activate, extend or revoke Premium across Student and Instructor portals.</p></section><section class="pm-card"><div class="pm-grid" id="premiumUsers"><p>Loading premium accounts…</p></div></section></main><script type="module" src="premium-management.js"></script></body></html>
