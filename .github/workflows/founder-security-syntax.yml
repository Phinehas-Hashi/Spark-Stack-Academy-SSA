name: Founder security syntax checks

on:
  pull_request:
    paths:
      - "founder/**"
      - "js/**"
      - "security-worker/**"
      - "institution/**"
      - "functions/**"
      - "tests/**"
      - "package.json"
      - "firestore.rules"
      - ".github/workflows/founder-security-syntax.yml"
  push:
    branches: [main]
    paths:
      - "founder/**"
      - "js/**"
      - "security-worker/**"
      - "firestore.rules"

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check changed security and Founder modules
        shell: bash
        run: |
          set -euo pipefail
          files=(
            founder/command-center.js
            founder/dashboard.js
            founder/js/founder-app.js
            founder/js/founder-dashboard.js
            founder/security.js
            founder/admissions.js
            founder/analytics.js
            founder/students.js
            founder/instructors.js
            founder/instructors-profile.js
            institution/js/register.js
            institution/js/institution-app.js
            institution/js/institution-courses.js
            functions/index.js
            founder/courses.js
            founder/certificates.js
            founder/platform-settings.js
            founder/notifications.js
            founder/reports.js
            founder/instructor-admissions.js
            founder/wallets/payouts.js
            js/firebase.js
            js/login.js
            js/admin-login.js
            tests/firestore.rules.test.mjs
            js/security-config.js
            js/security-telemetry.js
            security-worker/src/index.js
          )
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            node --input-type=module --check < "${file}"
          done

  firestore-rules-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Firestore rules tests in isolated emulator
        run: npx firebase emulators:exec --only firestore --project demo-spark-stack-academy-tenant-tests "npm run test:rules"
