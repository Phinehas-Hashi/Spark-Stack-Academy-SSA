<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an Issue | Spark Stack Academy</title><link rel="stylesheet" href="css/role-messaging.css"><style>body{font-family:Inter,Poppins,system-ui;background:#f6f8fc;color:#0f172a}.report-wrap{max-width:760px;margin:7vh auto;padding:30px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px;box-shadow:0 20px 55px rgba(15,23,42,.08)}h1{margin:0 0 8px}.muted{color:#64748b}.grid{display:grid;gap:16px;margin-top:22px}label{font-size:12px;font-weight:800;color:#334155}input,select,textarea{width:100%;margin-top:7px;padding:13px;border:1px solid #dbe4ef;border-radius:12px;box-sizing:border-box;outline:none}button{padding:13px 18px;border:0;border-radius:12px;background:#2979ff;color:#fff;font-weight:800}.result{margin-top:16px;padding:14px;border-radius:12px;background:#f1f5f9}.history{margin-top:22px;display:grid;gap:10px}.report{padding:14px;border:1px solid #e2e8f0;border-radius:14px}.report strong{display:block}.report span{font-size:11px;color:#64748b}</style></head><body><main class="report-wrap"><section class="card"><div class="muted">SPARK STACK ACADEMY • SUPPORT</div><h1>Report an issue</h1><p class="muted">Submit a concern, safety issue, platform problem or account report. You’ll receive a unique ticket ID.</p><form id="reportForm" class="grid"><label>Title<input id="reportTitle" required maxlength="120" placeholder="What happened?"></label><label>Category<select id="reportCategory"><option value="general">General</option><option value="account">Account</option><option value="content">Content</option><option value="harassment">Harassment / Safety</option><option value="payment">Payment</option><option value="technical">Technical</option></select></label><label>Priority<select id="reportPriority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select></label><label>Reported user ID (optional)<input id="reportedUserId"></label><label>Description<textarea id="reportDescription" rows="7" required maxlength="5000" placeholder="Give us the details…"></textarea></label><button type="submit">Submit Report</button></form><div id="reportResult" class="result"></div><div id="myReports" class="history"></div></section></main><script type="module" src="js/report-page.js"></script></body></html>
