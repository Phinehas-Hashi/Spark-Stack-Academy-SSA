<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chat | Spark Stack Academy</title><link rel="stylesheet" href="css/student-core.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/chat.css"><link rel="stylesheet" href="css/responsive.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script></head><body><div class="chat-page"><header class="chat-header"><div class="chat-left"><button id="backBtn" class="header-btn" aria-label="Go back"><i data-lucide="arrow-left"></i></button><div class="chat-avatar"><img id="chatAvatar" src="../assets/images/ssa-logo.png" alt="User"><span id="onlineDot" class="online-dot is-offline"></span></div><div class="chat-user"><h3 id="chatName">Loading...</h3><p id="chatStatus">Offline</p></div></div><div class="chat-actions"><button id="voiceCallBtn" class="header-btn" aria-label="Voice call"><i data-lucide="phone"></i></button><button id="videoCallBtn" class="header-btn" aria-label="Video call"><i data-lucide="video"></i></button><button id="chatMenuBtn" class="header-btn" aria-label="Chat options"><i data-lucide="more-vertical"></i></button></div></header><main class="chat-body"><div id="chatMessages" class="chat-messages"></div><div id="typingIndicator" class="typing-indicator hidden"><div class="typing-bubble"><span></span><span></span><span></span></div><p>Typing...</p></div></main><footer class="chat-composer"><button id="emojiBtn" class="composer-btn" aria-label="Emoji"><i data-lucide="smile"></i></button><button id="attachBtn" class="composer-btn" aria-label="Attach file"><i data-lucide="paperclip"></i></button><input type="file" id="fileInput" hidden><textarea id="messageInput" placeholder="Message…" rows="1" aria-label="Message"></textarea><button id="cameraBtn" class="composer-btn" aria-label="Camera"><i data-lucide="camera"></i></button><button id="voiceBtn" class="composer-btn" aria-label="Voice message"><i data-lucide="mic"></i></button><button id="sendBtn" class="send-btn" aria-label="Send message"><i data-lucide="send-horizontal"></i></button></footer><div id="uploadPreview" class="upload-preview hidden"><div class="preview-info"><i data-lucide="file"></i><span id="fileName">No file selected</span></div><button id="removeFileBtn" aria-label="Remove file"><i data-lucide="x"></i></button></div></div><script type="module" src="js/messages/chat-fixed.js"></script><script type="module" src="js/messages/emoji.js"></script><script type="module" src="js/messages/input.js"></script><script type="module" src="js/messages/chat-controls.js"></script><script type="module" src="js/messages/uploads.js"></script><script>lucide.createIcons();</script></body></html>
