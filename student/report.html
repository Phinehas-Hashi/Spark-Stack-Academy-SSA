<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report an Issue | Spark Stack Academy</title>
<link rel="stylesheet" href="../css/design-tokens.css?v=20261121-ui3">
<link rel="stylesheet" href="css/student-core.css?v=20261121-ui4">
<link rel="stylesheet" href="css/components.css?v=20261121-ui4">
<link rel="stylesheet" href="css/responsive.css?v=20261121-ui4">
<link rel="stylesheet" href="css/portal-shell.css?v=20261121-ui5">
<link rel="stylesheet" href="css/pages/report.css?v=20261121-page1">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="student-layout">
<aside id="sidebarContainer" class="sidebar-container"></aside>
<div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>
<main class="student-main">
<header id="topbarContainer" class="topbar-container"></header>
<section class="report-page"><div class="report-card"><span>SPARK SUPPORT</span><h1>Report an issue</h1><p>Tell the academy what happened. You'll receive a case ID and can track feedback here.</p><form id="reportForm" class="report-form"><label>Title<input id="reportTitle" required maxlength="120" placeholder="What happened?"></label><label>Category<select id="reportCategory"><option value="technical">Technical issue</option><option value="payment">Payment</option><option value="course">Course</option><option value="instructor">Instructor</option><option value="account">Account</option><option value="safety">Safety</option><option value="general">General</option></select></label><label>Priority<select id="reportPriority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select></label><label>Description<textarea id="reportDescription" required placeholder="Explain the issue clearly..."></textarea></label><input id="reportedUserId" type="hidden"><input id="courseId" type="hidden"><button type="submit">Submit Report</button></form><div id="reportResult" class="report-result" aria-live="polite"></div></div><div class="report-card"><h2>My Reports</h2><p>Track cases and feedback from the academy team.</p><div id="myReports"><div class="report-empty">Loading reports...</div></div></div></section>
</main>
</div>
<script type="module" src="js/student-app.js"></script><script type="module" src="../js/report-page.js"></script><script>document.addEventListener('DOMContentLoaded',()=>window.lucide?.createIcons());</script>
</body></html>
